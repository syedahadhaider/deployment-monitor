name = "deployment-monitor-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The D1 binding. `database_id` is filled in by `wrangler d1 create` - see the
# setup steps in the repository README.
[[d1_databases]]
binding = "DB"
database_name = "deployment-monitor"
database_id = "798654aa-e0ce-49a7-bd33-3629dac0bea6"
migrations_dir = "migrations"

[vars]
# Origins allowed to read /summary from a browser. The data is public, so this
# is tidiness rather than a security boundary - the write endpoint is the one
# that is actually guarded.
ALLOWED_ORIGINS = "https://syedahadhaider.com"

# Repository the watchdog nudges. Leave unset to disable the watchdog.
GITHUB_REPO = "syedahadhaider/deployment-monitor"

# INGEST_TOKEN is a SECRET and is never written here.
#   wrangler secret put INGEST_TOKEN

# Watchdog schedule. Cloudflare's cron is reliable, so this ticks every ten
# minutes, asks how old the newest recorded check is, and nudges the GitHub
# workflow ONLY when a scheduled run has actually been missed. It never runs
# the checks itself - those stay in Python on Actions.
[triggers]
crons = ["*/10 * * * *"]

# GITHUB_DISPATCH_TOKEN is a SECRET and is never written here.
#   wrangler secret put GITHUB_DISPATCH_TOKEN
